name: Build Android APK for ONE Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: npm ci

      - name: Build Web Assets & Sync Capacitor
        run: npm run cap:sync

      - name: Prepare Signing Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "Decoding SIGNING_KEY secret into android/app/release.keystore..."
            echo "$SIGNING_KEY" | base64 -d > android/app/release.keystore
          else
            echo "Generating persistent release keystore in android/app/release.keystore..."
            keytool -genkeypair -v -keystore android/app/release.keystore -alias smartmirror -keyalg RSA -keysize 2048 -validity 10000 -storepass "smartmirror123!" -keypass "smartmirror123!" -dname "CN=SmartMirror, OU=Dev, O=YPYO, L=Seoul, ST=Seoul, C=KR"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug & Signed Release APK
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-mirror-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Signed Release APK Artifact (ONE Store & Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: smart-mirror-signed-release-apk
          path: android/app/build/outputs/apk/release/*.apk
