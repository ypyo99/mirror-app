name: Build Android APK for ONE Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: npm ci

      - name: Build Web Assets & Sync Capacitor
        run: npm run cap:sync

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug & Release APK
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKey: ${{ secrets.SIGNING_KEY }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          alias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        continue-on-error: true

      - name: Fallback Self-Sign Release APK if secrets not configured
        if: steps.sign_app.outcome != 'success' || env.SIGNING_KEY == ''
        run: |
          # Create a persistent release keystore for signing
          keytool -genkeypair -v -keystore release.jks -alias smartmirror -keyalg RSA -keysize 2048 -validity 10000 -storepass "smartmirror123!" -keypass "smartmirror123!" -dname "CN=SmartMirror, OU=Dev, O=YPYO, L=Seoul, ST=Seoul, C=KR"
          
          # Find unsigned apk and sign it
          UNSIGNED_APK=$(find android/app/build/outputs/apk/release -name "*unsigned.apk" | head -n 1)
          if [ -n "$UNSIGNED_APK" ]; then
            echo "Signing $UNSIGNED_APK with apksigner..."
            SIGNED_APK="android/app/build/outputs/apk/release/smart-mirror-release-signed.apk"
            
            # Find apksigner
            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" "${UNSIGNED_APK%.apk}-aligned.apk"
            $BUILD_TOOLS_DIR/apksigner sign --ks release.jks --ks-pass pass:"smartmirror123!" --ks-key-alias smartmirror --key-pass pass:"smartmirror123!" --out "$SIGNED_APK" "${UNSIGNED_APK%.apk}-aligned.apk"
            
            echo "Release APK successfully signed: $SIGNED_APK"
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-mirror-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Signed Release APK Artifact (ONE Store & Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: smart-mirror-signed-release-apk
          path: |
            android/app/build/outputs/apk/release/*signed*.apk
            android/app/build/outputs/apk/release/*.apk

